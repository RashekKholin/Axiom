<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#0f1115">
    <link rel="manifest" href="manifest.json">
    <title>Axiom</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0f1115;
            color: #f5f5f7;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                system-ui,
                sans-serif;
        }
        body {
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }
        button {
            font: inherit;
        }
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        .header {
            padding:
                calc(env(safe-area-inset-top) + 20px)
                20px
                16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }
        .settings-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #1b1e25;
            color: #f5f5f7;
            font-size: 20px;
            cursor: pointer;
        }
        /* Main */
        main {
            flex: 1;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 8px 20px 110px;
        }
        .greeting {
            margin-top: 12px;
            margin-bottom: 28px;
        }
        .greeting p {
            margin: 0 0 6px;
            color: #9699a3;
            font-size: 15px;
        }
        .greeting h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.1;
            letter-spacing: -1.2px;
        }
        /* Study Card */
        .study-card {
            background: #1b1e25;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .study-card-label {
            color: #9699a3;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .study-card h2 {
            margin: 0 0 8px;
            font-size: 25px;
            letter-spacing: -0.6px;
        }
        .study-card p {
            margin: 0 0 20px;
            color: #aeb1ba;
            line-height: 1.5;
        }
        .primary-button {
            width: 100%;
            min-height: 52px;
            border: none;
            border-radius: 16px;
            background: #f5f5f7;
            color: #0f1115;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .primary-button:active {
            transform: scale(0.98);
        }
        /* Sections */
        .section {
            margin-bottom: 28px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-header h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: -0.3px;
        }
        .section-header span {
            color: #777b86;
            font-size: 13px;
        }
        /* Weak Areas */
        .weak-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #17191f;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 8px;
        }
        .weak-area:last-child {
            margin-bottom: 0;
        }
        .weak-area-name {
            font-size: 15px;
            font-weight: 500;
        }
        .weak-area-progress {
            color: #8f929c;
            font-size: 13px;
        }
        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .action-button {
            min-height: 74px;
            border: none;
            border-radius: 18px;
            background: #17191f;
            color: #f5f5f7;
            text-align: left;
            padding: 16px;
            cursor: pointer;
        }
        .action-button strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .action-button span {
            color: #858994;
            font-size: 12px;
        }
        .action-button:active {
            transform: scale(0.98);
        }
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding:
                8px
                12px
                calc(8px + env(safe-area-inset-bottom));
            background: rgba(15, 17, 21, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid #242731;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            z-index: 100;
        }
        .nav-button {
            border: none;
            background: transparent;
            color: #777b86;
            min-height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }
        .nav-button.active {
            color: #f5f5f7;
        }
        .nav-icon {
            font-size: 19px;
            line-height: 1;
        }
        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }
        /* Desktop */
        @media (min-width: 700px) {
            main {
                padding-left: 28px;
                padding-right: 28px;
            }
            .bottom-nav {
                left: 50%;
                transform: translateX(-50%);
                width: min(700px, 100%);
                border-radius: 22px 22px 0 0;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo">Axiom</div>
        <button
            class="settings-button"
            aria-label="Settings"
        >
            ⚙︎
        </button>
    </header>
    <main>
        <section class="greeting">
            <p>Good evening.</p>
            <h1>What will you learn?</h1>
        </section>
        <section class="study-card">
            <div class="study-card-label">Today's Study</div>
            <h2>Ready when you are.</h2>
            <p>
                Your personalized study system will appear here
                once you begin adding material.
            </p>
            <button class="primary-button">
                Start Studying
            </button>
        </section>
        <section class="section">
            <div class="section-header">
                <h2>Weak Areas</h2>
                <span>Coming soon</span>
            </div>
            <div class="weak-area">
                <div class="weak-area-name">
                    No study data yet
                </div>
                <div class="weak-area-progress">
                    —
                </div>
            </div>
        </section>
        <section class="section">
            <div class="section-header">
                <h2>Quick Actions</h2>
            </div>
            <div class="quick-actions">
                <button class="action-button">
                    <strong>Flashcards</strong>
                    <span>Review material</span>
                </button>
                <button class="action-button">
                    <strong>Practice</strong>
                    <span>Answer questions</span>
                </button>
                <button class="action-button">
                    <strong>Mixed Review</strong>
                    <span>Study across topics</span>
                </button>
                <button class="action-button">
                    <strong>Add Material</strong>
                    <span>Build your library</span>
                </button>
            </div>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-button active">
            <span class="nav-icon">⌂</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-button">
            <span class="nav-icon">▣</span>
            <span class="nav-label">Study</span>
        </button>
        <button class="nav-button">
            <span class="nav-icon">＋</span>
            <span class="nav-label">Add</span>
        </button>
        <button class="nav-button">
            <span class="nav-icon">◔</span>
            <span class="nav-label">Progress</span>
        </button>
        <button class="nav-button">
            <span class="nav-icon">⚙</span>
            <span class="nav-label">Settings</span>
        </button>
    </nav>
</div>
</body>
</html>
